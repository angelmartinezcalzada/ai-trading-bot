<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Bot · Panel</title>
<style>body{margin:0 auto;background:#07090f;color:#e8ecf5;font:14px system-ui,-apple-system;padding:12px;max-width:720px}
.big{font-size:38px;font-weight:800}.g{color:#22e39a}.r{color:#ff5470}.y{color:#ffc145}.m{color:#8b93a7;font-size:12px}
.c{background:#111522;border:1px solid #1d2336;border-radius:12px;padding:10px;margin:8px 0}h3{margin:14px 0 4px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:4px 3px;border-bottom:1px solid #1a1f30;text-align:left}th{color:#8b93a7;font-weight:500}
.bar{background:#1d2336;border-radius:4px;height:6px}.bar i{display:block;height:6px;border-radius:4px;background:#ffc145}
#st{position:sticky;top:0;background:#07090f;padding:4px 0;z-index:2}canvas{width:100%;height:140px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style>
<div id=st class=m>Cargando…</div>
<div class=big id=eq>…</div><div id=day></div><canvas id=ch></canvas>
<h3>Salud de procesos</h3><div class=c id=procs></div>
<h3>Posiciones abiertas</h3><div id=pos></div>
<h3>Actividad en directo (Solana)</h3><div class=c id=scans></div>
<h3>Motivos de rechazo (24 h)</h3><div class=c id=reasons></div>
<h3>Últimas compras bloqueadas</h3><div class=c id=blocked></div>
<h3>Operaciones reales recientes</h3><div class=c id=trades></div>
<h3>Cerebro / modelo</h3><div class=c id=brain></div>
<h3>Otros exchanges</h3><div class=grid id=ex></div>
<h3>Eventos</h3><div class="c m" id=ev></div>
<h3>Últimas decisiones</h3><div id=dec></div>
<div class=m style="margin:16px 0"><a href=/panel style=color:#8b93a7>Panel avanzado</a> · <a href=/logout style=color:#8b93a7>Salir</a></div>
<script>
const $=i=>document.getElementById(i),f=(x,d=2)=>x==null||isNaN(x)?'—':(+x).toFixed(d),E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),sg=x=>x>=0?'g':'r';
const age=s=>s==null?'—':s<90?s+' s':s<5400?Math.round(s/60)+' min':Math.round(s/3600)+' h';
function chart(c,p){const x=c.getContext('2d'),W=c.width=c.clientWidth*2,H=c.height=280;x.clearRect(0,0,W,H);if(p.length<2)return;
 let v=p.map(a=>a[1]),lo=Math.min(...v),hi=Math.max(...v);if(hi-lo<1e-6){hi+=.01;lo-=.01}const t0=p[0][0],t1=p[p.length-1][0],X=t=>(t-t0)/((t1-t0)||1)*W,Y=y=>H-20-(y-lo)/(hi-lo)*(H-40);
 x.strokeStyle=v[v.length-1]>=v[0]?'#22e39a':'#ff5470';x.lineWidth=3;x.beginPath();p.forEach((a,i)=>i?x.lineTo(X(a[0]),Y(a[1])):x.moveTo(X(a[0]),Y(a[1])));x.stroke();
 x.fillStyle='#8b93a7';x.font='20px system-ui';x.fillText(hi.toFixed(2)+' $',4,18);x.fillText(lo.toFixed(2)+' $',4,H-2)}
let busy=false,lastOk=0,lastEq='';
async function tick(){if(busy||document.hidden)return;busy=true;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
 try{const r=await fetch('/api/live2',{signal:ac.signal,cache:'no-store'});if(r.status==401){location='/login';return}const d=await r.json();lastOk=Date.now();render(d)}
 catch(e){}finally{clearTimeout(to);busy=false;status()}}
function status(){const s=Math.round((Date.now()-lastOk)/1000);$('st').innerHTML=lastOk?(s<30?'<span class=g>●</span> en directo · actualizado hace '+s+' s':'<span class=r>●</span> sin conexión hace '+s+' s, reintentando…'):'Cargando…'}
function render(d){if(d.error){$('st').textContent='Error: '+d.error;return}
 $('eq').textContent=f(d.equity)+' $';const du=(d.equity||0)-(d.equity||0)/(1+(d.day_pct||0)/100);
 $('day').innerHTML=`<span class=${sg(du)}>${du>=0?'+':''}${f(du)} $ (${f(d.day_pct)} %) hoy</span> <span class=m>· efectivo ${f(d.cash)} $ · ${d.mode=='live'?'DINERO REAL':E(d.mode)}${d.halted?' · ⛔ PARADO':''}${d.paused?' · ⏸ pausa':''} · histórico ${d.stats.closed??'—'} cierres, ${f((d.stats.win_rate||0)*100,0)} % ganados, ${f(d.stats.net_pnl)} $</span>`;
 const k=JSON.stringify(d.eq.slice(-1));if(k!=lastEq){lastEq=k;chart($('ch'),d.eq)}
 $('procs').innerHTML='<table>'+d.procs.map(p=>`<tr><td>${p.up?'🟢':'🔴'} ${E(p.name)}</td><td class=m>último log hace ${age(p.log_age_s)}</td></tr>`).join('')+'</table>';
 $('pos').innerHTML=d.pos.length?d.pos.map(p=>`<div class=c><b>${E(p.sym)}</b> <span class=${sg(p.pnl)}>${f(p.pnl,3)} $ (${f(p.pnl_pct)} %)</span> <span class=m>${f(p.age_min,0)} min</span><br><span class=m>entrada ${p.entry.toPrecision(4)} · ahora ${(+p.mark||0).toPrecision(4)} · stop −6 % ${p.stop.toPrecision(4)} · trailing ${p.trail.toPrecision(4)} (máx ${p.peak.toPrecision(4)})</span></div>`).join(''):'<div class="c m">Sin posiciones abiertas, todo en efectivo.</div>';
 $('scans').innerHTML=d.scans.length?'<table><tr><th>Hora</th><th>Monedas</th><th>Con liquidez</th><th>Evaluadas</th><th>Ya vetadas</th><th>Pasan</th></tr>'+d.scans.map(s=>`<tr><td>${s.t}</td><td>${s.mints}</td><td>${s.liq}</td><td>${s.eval??'—'}</td><td>${s.skipped??'—'}</td><td class=${s.passed?'g':'m'}>${s.passed}</td></tr>`).join('')+'</table>':'<span class=m>Sin escaneos recientes</span>';
 const mx=Math.max(1,...d.reasons.map(r=>r[1]));$('reasons').innerHTML=d.reasons.length?d.reasons.map(([k,n])=>`<div>${E(k)} <b style=float:right>${n}</b><div class=bar><i style="width:${n/mx*100}%"></i></div></div>`).join(''):'<span class=m>Ninguno registrado</span>';
 $('blocked').innerHTML=d.blocked.length?'<table>'+d.blocked.map(b=>`<tr><td>${b.t}</td><td><b>${E(b.sym)}</b></td><td class=m>${E(b.why)}</td></tr>`).join('')+'</table>':'<span class=m>Ninguna</span>';
 $('trades').innerHTML=d.trades.length?'<table>'+d.trades.map(t=>`<tr><td class=m>${E(t.t)}</td><td>${t.side=='BUY'?'🟢 compra':'🔻 venta'} <b>${E(t.sym)}</b></td><td class=${t.side=='BUY'?'':sg(t.pnl)}>${t.side=='BUY'?'':f(t.pnl,3)+' $'}</td></tr><tr><td></td><td colspan=2 class=m>${E(t.why)}</td></tr>`).join('')+'</table>':'<span class=m>Ninguna</span>';
 const b=d.brain;$('brain').innerHTML=`${b.active?'<span class=g>ACTIVO</span>':'<span class=y>No activo (no supera la prueba fuera de muestra)</span>'}<br><span class=m>actualizado ${E((b.updated||'').replace('T',' '))} · ${b.n??'—'} ejemplos · política ${E(b.policy)} · operaciones del modelo en test ${b.trades??'—'} (media ${f(b.ret,1)} %) vs base ${f(b.base_ret,1)} %</span>`;
 $('ex').innerHTML=Object.entries(d.ex).map(([k,e])=>`<div class=c><b>${k[0].toUpperCase()+k.slice(1)}</b> <span class=m>${e.mode=='live'?'real':'papel'}</span><br><span class=big style=font-size:20px>${f(e.equity)} $</span><br><span class="m ${sg(e.day||0)}">${f(e.day)} % hoy</span><span class=m> · ${e.open} abiertas · hace ${age(e.age_s)}${e.halted?' · ⛔':''}</span></div>`).join('');
 $('ev').innerHTML=d.events.map(E).join('<br>')||'—';
 $('dec').innerHTML=d.decisions.map(x=>`<details class=c><summary>${E(x.split('\n')[0].replace(/^## /,''))}</summary><div class=m style=white-space:pre-wrap>${E(x.split('\n').slice(1).join('\n'))}</div></details>`).join('')}
tick();setInterval(tick,12000);setInterval(status,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script></html>
